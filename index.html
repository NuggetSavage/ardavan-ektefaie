<script>
(function(){
  var s=document.getElementById('scaler'), img=document.getElementById('inv');
  function fit(){
    var w=window.innerWidth, h=window.innerHeight, k=Math.min(w/1080,h/1920);
    var x=(w-1080*k)/2, y=Math.max(0,(h-1920*k)/2);
    s.style.left='0'; s.style.transform='translate('+x+'px,'+y+'px) scale('+k+')';
  }
  fit(); window.addEventListener('resize',fit);
  if(/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)){
    var m=document.getElementById('maps'); m.href='https://maps.apple.com/?q=Old%20North%20Church&ll=34.1456,-118.3177'; m.removeAttribute('target');
  }
  function show(){ s.classList.add('ready'); }
  if(img.complete) show(); else { img.addEventListener('load',show); setTimeout(show,3000); }
})();
</script>
