[[headers]]
  for = "/memorial-service.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Old Netlify address now sends everyone to the current site (Cloudflare ignores this file)
[[redirects]]
  from = "/*"
  to = "https://ardavan-ektefaie.pages.dev/:splat"
  status = 301
  force = true
